name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make build && make tag

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.MALICE_GHCR_TOKEN }}" | docker login ghcr.io -u rufftruffles --password-stdin

      - name: Push
        run: |
          docker tag malice/rizin:latest ghcr.io/rufftruffles/malice-rizin:1.0.0
          docker tag malice/rizin:latest ghcr.io/rufftruffles/malice-rizin:latest
          docker push ghcr.io/rufftruffles/malice-rizin:1.0.0
          docker push ghcr.io/rufftruffles/malice-rizin:latest
